<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Misión 06: Escape del Algoritmo | ojo al clic</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --fondo: #050a14; --cian: #00ffff; --fucsia: #ff00ff; --amarillo: #fbff00; --rojo: #ff3e3e; --verde: #00ff66; }
        body { background: var(--fondo); color: white; font-family: 'Orbitron', sans-serif; margin: 0; overflow: hidden; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #11052C 0%, #050a14 100%); }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 20; pointer-events: none; }
        .stat { font-size: 1.1rem; text-shadow: 2px 2px #000; color: var(--cian); margin-bottom: 5px; }
        
        #bar-container {
            width: 200px;
            height: 18px;
            background: #222;
            border: 2px solid var(--cian);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        #atencion-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--rojo), var(--amarillo), var(--verde));
            transition: width 0.2s ease;
        }

        #pantalla-info {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; background: rgba(5,10,20,0.95); padding: 35px;
            border: 3px solid var(--fucsia); border-radius: 15px; z-index: 100;
            box-shadow: 0 0 30px var(--fucsia); min-width: 280px; max-width: 85vw;
        }
        button {
            background: var(--cian); color: #000; border: none; padding: 15px 35px;
            font-family: 'Orbitron'; font-weight: 900; cursor: pointer;
            font-size: 1.2rem; border-radius: 5px; box-shadow: 0 5px 0 #008b8b;
            margin-top: 20px; transition: 0.2s;
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        .salir-btn {
            position: absolute; bottom: 20px; right: 20px;
            color: var(--cian); text-decoration: none; font-size: 0.8rem;
            border: 1px solid var(--cian); padding: 8px 15px; z-index: 50;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div class="stat">TIEMPO REAL ENFOQUE: <span id="score" style="color:var(--amarillo);">0s</span></div>
        <div class="stat">SALUD MENTAL: <span id="attention-text" style="color:var(--verde);">100%</span></div>
        <div id="bar-container">
            <div id="atencion-bar"></div>
        </div>
    </div>
    <div id="pantalla-info">
        <h1 id="titulo" style="color:var(--amarillo); margin-top:0;">MISIÓN 06</h1>
        <p id="descripcion">
            ¡El Algoritmo te bombardea con RRSS!<br><br>
            Atrapa <b>VIDA REAL (📚🎨⚽😴)</b> para desinflar tu mente (+10%)<br>
            Esquiva <b>MÓVILES CON RRSS (📱 TikTok, Insta, YT)</b> o tu cerebro se hinchará (-25%)
        </p>
        <button onclick="iniciarJuegoCompleto()">¡SALVAR MI CEREBRO!</button>
    </div>
    <a href="../recreativo.html" class="salir-btn">SALIR AL RECREATIVO</a>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const attentionText = document.getElementById('attention-text');
const atencionBar = document.getElementById('atencion-bar');
const pantalla = document.getElementById('pantalla-info');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0, atencion = 100, gameRunning = false, items = [], timeInterval;
let player = { x: canvas.width / 2, y: canvas.height - 120, baseSize: 50, size: 50 };

// Lista de móviles con redes sociales
const rrssMobiles = [
    { text: '📱TikTok', color: '#ff0050' },
    { text: '📱Insta', color: '#e1306c' },
    { text: '📱YouTube', color: '#ff0000' },
    { text: '📱X', color: '#ffffff' },
    { text: '📱Twitch', color: '#9146ff' },
    { text: '📱Snap', color: '#fffc00' }
];

const vidaReal = ['📚', '🎨', '⚽', '😴', '🎸', '🌱'];

// MOTOR DE SONIDO RETRO
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(frequency, duration, type = 'square', volume = 0.1) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + duration);
}

function soundIntro() {
    playSound(300, 0.1, 'square', 0.1);
    setTimeout(() => playSound(500, 0.1, 'square', 0.1), 100);
    setTimeout(() => playSound(700, 0.3, 'square', 0.1), 200);
}

function soundScore() { playSound(900, 0.08, 'square', 0.08); } 
function soundDamage() { 
    playSound(150, 0.1, 'sawtooth', 0.2); 
    setTimeout(() => playSound(100, 0.2, 'sawtooth', 0.2), 80);
} 
function soundGameOver() {
    playSound(250, 0.2, 'square', 0.15);
    setTimeout(() => playSound(180, 0.2, 'square', 0.15), 200);
    setTimeout(() => playSound(90, 0.5, 'triangle', 0.2), 400);
}

// Controles
window.addEventListener('mousemove', (e) => { player.x = e.clientX - player.size/2; });
window.addEventListener('touchmove', (e) => { 
    player.x = e.touches[0].clientX - player.size/2;
    e.preventDefault();
}, {passive: false});

function iniciarJuegoCompleto() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    soundIntro();
    setTimeout(startGame, 400);
}

function startGame() {
    score = 0; atencion = 100; items = [];
    actualizarUI();
    gameRunning = true;
    pantalla.style.display = 'none';
    
    clearInterval(timeInterval);
    timeInterval = setInterval(() => {
        if(gameRunning) {
            score++;
            scoreEl.innerText = score + "s";
        }
    }, 1000);

    animate();
}

function actualizarUI() {
    atencion = Math.min(100, Math.max(0, atencion));
    attentionText.innerText = Math.round(atencion) + "%";
    atencionBar.style.width = atencion + "%";

    // EFECTO DE HINCHAZÓN: Cuanta menos salud mental (atención), más grande e hinchado está el cerebro
    let hinchazon = (100 - atencion) * 0.9; 
    player.size = player.baseSize + hinchazon;

    if(atencion > 60) {
        attentionText.style.color = "var(--verde)";
    } else if(atencion > 30) {
        attentionText.style.color = "var(--amarillo)";
    } else {
        attentionText.style.color = "var(--rojo)";
    }
}

function spawnItem() {
    const isBad = Math.random() > 0.35;
    let data;

    if (isBad) {
        data = rrssMobiles[Math.floor(Math.random() * rrssMobiles.length)];
    } else {
        data = { text: vidaReal[Math.floor(Math.random() * vidaReal.length)], color: '#00ff66' };
    }

    items.push({
        x: Math.random() * (canvas.width - 80),
        y: -50,
        speed: 4 + (score / 15),
        text: data.text,
        color: data.color,
        isBad: isBad
    });
}

function animate() {
    if (!gameRunning) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Dibujar Jugador (Cerebro con tamaño dinámico)
    ctx.font = `${player.size}px Arial`;
    ctx.fillText('🧠', player.x, player.y + player.size/2);

    if (Math.random() < 0.08) spawnItem();

    items.forEach((item, index) => {
        item.y += item.speed;
        
        // Renderizar item con estilo
        if (item.isBad) {
            ctx.font = 'bold 22px Orbitron, sans-serif';
            ctx.fillStyle = item.color;
            ctx.fillText(item.text, item.x, item.y);
        } else {
            ctx.font = '40px Arial';
            ctx.fillText(item.text, item.x, item.y);
        }

        // Detección de colisiones ajustada al tamaño del cerebro hinchado
        if (item.y > player.y - 20 && item.y < player.y + player.size &&
            item.x > player.x - 30 && item.x < player.x + player.size) {
            
            if (item.isBad) {
                atencion -= 25;
                soundDamage();
                ctx.fillStyle = "rgba(255, 0, 0, 0.35)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                atencion += 10;
                soundScore();
            }
            
            actualizarUI();
            items.splice(index, 1);
        }

        if (item.y > canvas.height) items.splice(index, 1);
    });

    if (atencion <= 0) {
        gameRunning = false;
        clearInterval(timeInterval);
        soundGameOver();
        
        pantalla.style.display = 'block';
        document.getElementById('titulo').innerText = "💥 ¡CEREBROEXPLOTADO!";
        document.getElementById('titulo').style.color = "var(--rojo)";
        document.getElementById('descripcion').innerHTML = `
            Las redes han hinchado tu mente hasta colapsar.<br><br>
            Aguantaste enfocado/a: <b style="color:var(--amarillo);">${score} segundos</b>
        `;
        const btn = document.querySelector('button');
        btn.innerText = "DESINFLAR Y REINTENTAR";
        btn.setAttribute('onclick', 'startGame()');
    } else {
        requestAnimationFrame(animate);
    }
}

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
